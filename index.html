<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Denkspaß</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Denkspaß">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E8F0F8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: eine Spalte wie eine Handy-App. Startseite scrollt, Spielrunden passen auf einen Bildschirm. */
:root{
  --bg:#E8F0F8; --surface:#FFFFFF; --ink:#152238; --muted:#566781; --line:#D3DEEA; --soft:#DDE6F0;
  --sun:#FFB800; --sun-deep:#B67800; --sun-soft:#FFF1C7;
  --good:#1E9E62; --good-deep:#13744A; --good-soft:#D9F4E6;
  --bad:#D9434A; --bad-soft:#FBE1E2;
  --on-ink:#FFFFFF; --ink-2:#2A3B59;
  --c-rechnen:#2F6FEB; --p-rechnen:#DCE7FF;
  --c-paare:#D9601F;  --p-paare:#FFE4D3;
  --c-zahlen:#7447DB; --p-zahlen:#EAE2FF;
  --c-farbe:#C93479;  --p-farbe:#FFDEEC;
  --c-wort:#12865F;   --p-wort:#D5F2E6;
  --c-finde:#08809F;  --p-finde:#D3EFF8;
  --display:'Fredoka','Arial Rounded MT Bold',ui-rounded,system-ui,sans-serif;
  --body:'Nunito',ui-rounded,-apple-system,system-ui,sans-serif;
  --r:20px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;min-height:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun-deep);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}
p{margin:0}
#app{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
#screen{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:0 1px 0 var(--line),0 8px 24px rgba(21,34,56,.06)}
.sec{font-size:1.3rem;display:flex;align-items:baseline;justify-content:space-between;margin-top:6px}
.sec small{font-family:var(--body);font-size:.9rem;color:var(--muted);font-weight:800}

/* Start */
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hello h1{font-size:2.1rem;line-height:1.1}
.streak{display:flex;flex-direction:column;align-items:center;background:var(--surface);border-radius:18px;padding:8px 14px;color:#AAB6C6;min-width:72px;box-shadow:0 1px 0 var(--line)}
.streak.on{color:#F06A12}
.streak b{font-family:var(--display);font-size:1.4rem;line-height:1;color:var(--ink)}
.streak span{font-size:.75rem;font-weight:800;color:var(--muted)}
.level{display:flex;align-items:center;gap:14px;padding:14px 16px}
.lv-badge{flex:none;width:58px;height:58px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.7rem;box-shadow:inset 0 -4px 0 var(--sun-deep)}
.lv-badge.big{width:96px;height:96px;font-size:2.8rem;margin:0 auto}
.lv-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.lv-title{font-family:var(--display);font-weight:600;font-size:1.15rem}
.lv-title small{font-family:var(--body);font-weight:800;color:var(--muted);font-size:.8rem;margin-left:6px}
.xpbar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sun),#FF8A00);transition:width .9s ease}
.lv-sub{font-size:.85rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.daily{background:var(--ink);color:var(--on-ink);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.daily-top{display:flex;align-items:center;gap:14px}
.daily-txt{flex:1;min-width:0}
.daily h2{font-size:1.35rem}
.daily p{font-size:.95rem;opacity:.85}
.dots{display:flex;gap:8px;margin-top:8px}
.dots i{width:30px;height:30px;border-radius:50%;background:var(--ink-2);display:grid;place-items:center;font-style:normal;font-weight:800;color:var(--ink);font-size:.95rem}
.dots i.on{background:var(--sun)}
.chest{flex:none}
.chest.open{animation:wiggle 1.6s ease-in-out infinite}
.cta{display:block;width:100%;padding:16px;border-radius:16px;background:var(--sun);color:var(--ink);font-family:var(--display);font-weight:600;font-size:1.2rem;box-shadow:0 4px 0 var(--sun-deep);text-align:center;transition:transform .08s}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sun-deep)}
.cta.alt{background:var(--surface);box-shadow:0 4px 0 var(--line)}
.cta.alt:active{box-shadow:0 1px 0 var(--line)}
.daily .cta small{display:block;font-family:var(--body);font-size:.8rem;font-weight:700;opacity:.8}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--p);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;transition:transform .1s}
.tile:active{transform:scale(.97)}
.art{height:72px;border-radius:14px;background:rgba(255,255,255,.7);display:grid;place-items:center}
.t-name{font-family:var(--display);font-weight:600;font-size:1.15rem;line-height:1.15;padding-inline:2px}
.t-meta{display:flex;justify-content:space-between;font-size:.82rem;font-weight:800;color:var(--c);padding-inline:2px;font-variant-numeric:tabular-nums}

.art-math{font-family:var(--display);font-size:2rem;font-weight:700;color:var(--c)}
.art-math em{font-style:normal;color:var(--sun-deep);margin:0 .12em}
.art-cards{display:flex;gap:8px}
.art-cards i{width:32px;height:44px;border-radius:7px;background:var(--c);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 4px,transparent 4px 9px);transform:rotate(-6deg)}
.art-cards i.up{background:var(--surface);border:2.5px solid var(--c);transform:rotate(5deg);display:grid;place-items:center;font-style:normal;color:var(--c);font-size:1.1rem}
.art-digits{display:flex;gap:5px}
.art-digits b{display:grid;place-items:center;width:30px;height:40px;border-radius:9px;background:var(--c);color:var(--on-ink);font-family:var(--display);font-size:1.4rem}
.art-digits b:nth-child(2){transform:translateY(-5px)}
.art-stroop{font-family:var(--display);font-size:2rem;font-weight:700;color:#2563EB;letter-spacing:.05em}
.art-tiles{display:flex;gap:4px}
.art-tiles b{display:grid;place-items:center;width:28px;height:32px;border-radius:7px;background:var(--surface);border-bottom:3px solid var(--c);color:var(--c);font-family:var(--display);font-size:1.1rem}
.art-tiles b:nth-child(odd){transform:rotate(-8deg) translateY(2px)}
.art-tiles b:nth-child(even){transform:rotate(7deg)}
.art-dots{display:grid;grid-template-columns:repeat(3,13px);gap:7px}
.art-dots i{width:13px;height:13px;border-radius:50%;background:var(--c)}
.art-dots i.odd{background:var(--sun);transform:scale(1.25)}

.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.medal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.05rem;background:var(--soft);color:#9AA8BC;border:3px dashed #C5D1DE}
.badge.got .medal{background:var(--sun);color:var(--ink);border:3px solid var(--surface);box-shadow:0 3px 0 var(--sun-deep)}
.medal.big{width:92px;height:92px;font-size:1.8rem;margin:0 auto}
.badge span{font-size:.72rem;font-weight:800;line-height:1.15;text-align:center;color:var(--muted)}
.badge.got span{color:var(--ink)}

.namecard{padding:16px;display:flex;flex-direction:column;gap:10px}
.namecard label{font-weight:800}
.namerow{display:flex;gap:8px}
.namerow input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.namerow button{padding:0 18px;border-radius:12px;background:var(--ink);color:var(--on-ink);font-weight:800}
.foot{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin-top:8px}
.foot button{color:var(--muted);font-size:.9rem;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:6px}
.confirm{padding:16px;display:flex;flex-direction:column;gap:12px;text-align:center}
.confirm .row{display:flex;gap:10px}
.btn-danger{flex:1;padding:12px;border-radius:12px;background:var(--bad);color:var(--on-ink);font-weight:800}
.btn-plain{flex:1;padding:12px;border-radius:12px;background:var(--soft);font-weight:800}

/* Spiel-Übersicht */
.back{align-self:flex-start;display:flex;align-items:center;gap:4px;padding:8px 14px 8px 10px;border-radius:99px;background:var(--surface);font-weight:800;color:var(--muted);box-shadow:0 1px 0 var(--line)}
.g-head{background:var(--p);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.g-head .art{height:96px}
.g-head .art > *{transform:scale(1.35)}
.g-head h1{font-size:1.9rem}
.g-head p{font-size:1rem}
.chip{align-self:flex-start;background:var(--surface);color:var(--c);font-weight:800;font-size:.82rem;padding:5px 12px;border-radius:99px}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.stage-btn{aspect-ratio:1/1.12;border-radius:16px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 0 var(--line);max-width:100%}
.stage-btn b{font-family:var(--display);font-size:1.45rem;line-height:1}
.stage-btn .st{font-size:.72rem;letter-spacing:.02em;color:#C5D1DE}
.stage-btn .st i{font-style:normal;color:var(--sun)}
.stage-btn.cur{outline:3px solid var(--c);outline-offset:-3px}
.stage-btn.lock{background:var(--soft);box-shadow:none;color:#9AA8BC;cursor:default}
.hint{font-size:.9rem;color:var(--muted);text-align:center;font-weight:700}

/* Runde */
.play{position:relative;display:flex;flex-direction:column;gap:12px;min-height:calc(100dvh - 60px)}
.play-top{display:flex;align-items:center;gap:12px}
.x{flex:none;width:46px;height:46px;border-radius:50%;background:var(--surface);font-size:1.2rem;font-weight:800;color:var(--muted);box-shadow:0 1px 0 var(--line)}
.play-title{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.play-title b{font-family:var(--display);font-weight:600;font-size:1.15rem}
.play-title span{font-size:.85rem;font-weight:800;color:var(--muted)}
.combo{margin-left:auto;background:var(--sun);border-radius:99px;padding:6px 12px;font-family:var(--display);font-weight:600;font-size:1rem;display:flex;align-items:center;gap:4px;animation:pop .35s ease}
.combo svg{color:#E0520C}
.prog{height:10px;border-radius:99px;background:var(--surface);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--c);border-radius:99px;transition:width .4s ease}
.stage{display:flex;flex-direction:column;gap:16px;padding-top:8px;-webkit-user-select:none;user-select:none}
.ask{text-align:center;font-weight:800;color:var(--muted);font-size:1.05rem}
.ask b{color:var(--ink)}
.ask.alt{background:var(--sun-soft);border-radius:12px;padding:6px 10px;color:var(--ink)}
.equation{text-align:center;font-family:var(--display);font-weight:600;font-size:clamp(2.2rem,11vw,3.2rem);line-height:1.1;font-variant-numeric:tabular-nums;padding-block:12px}
.equation .q{color:var(--c)}
.bonus{height:6px;border-radius:99px;background:var(--surface);overflow:hidden;margin-inline:20%}
.bonus i{display:block;height:100%;width:100%;background:var(--sun);border-radius:99px}
.bonus-l{text-align:center;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:-10px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.choice{background:var(--surface);border-radius:18px;padding:22px 0;font-family:var(--display);font-weight:600;font-size:2rem;box-shadow:0 4px 0 var(--line);font-variant-numeric:tabular-nums}
.choice:active{transform:translateY(2px)}
.ok{background:var(--good)!important;color:var(--on-ink)!important;box-shadow:0 4px 0 var(--good-deep)!important;animation:pop .3s ease}
.no{background:var(--bad)!important;color:var(--on-ink)!important;box-shadow:0 4px 0 #A22D33!important;animation:shake .4s ease}

.memo{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding-block:24px}
.memo b{display:grid;place-items:center;width:clamp(36px,11vw,52px);height:clamp(50px,15vw,68px);border-radius:12px;background:var(--surface);color:var(--c);font-family:var(--display);font-size:clamp(1.8rem,8vw,2.5rem);box-shadow:0 4px 0 var(--line);animation:pop .35s ease backwards}
.shrink{height:8px;border-radius:99px;background:var(--surface);overflow:hidden;margin-inline:15%}
.shrink i{display:block;height:100%;width:100%;background:var(--c)}
.slots{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.slot{flex:0 1 46px;min-width:0;height:58px;border-radius:10px;background:var(--surface);border-bottom:4px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:clamp(1.3rem,6vw,2rem)}
.slot.f{border-color:var(--c)}
.slots.good .slot{background:var(--good-soft);border-color:var(--good)}
.slots.badx .slot{background:var(--bad-soft);border-color:var(--bad);animation:shake .4s ease}
.solution{text-align:center;font-weight:800;color:var(--muted)}
.solution b{font-family:var(--display);font-size:1.4rem;color:var(--good);letter-spacing:.1em}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.pad button{height:62px;border-radius:16px;background:var(--surface);font-family:var(--display);font-weight:600;font-size:1.8rem;box-shadow:0 3px 0 var(--line)}
.pad button:active{transform:translateY(2px)}
.pad .del{font-size:1.3rem;color:var(--muted)}

.cards{display:grid;gap:8px}
.cards.c3{grid-template-columns:repeat(3,1fr);padding-inline:8%}
.cards.c4{grid-template-columns:repeat(4,1fr)}
.cardx{aspect-ratio:3/4;perspective:700px;max-width:100%}
.cards.sq .cardx{aspect-ratio:1/1}
.cardx .in{position:relative;display:block;width:100%;height:100%;transition:transform .35s ease;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.cardx.up .in{transform:rotateY(180deg)}
.cardx .bk,.cardx .fc{position:absolute;inset:0;border-radius:12px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cardx .bk{background:var(--c);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 5px,transparent 5px 11px);box-shadow:0 3px 0 rgba(21,34,56,.18)}
.cardx .fc{background:var(--surface);transform:rotateY(180deg);font-size:clamp(1.5rem,8vw,2.3rem);border:2px solid var(--line)}
.cardx.done .fc{background:var(--good-soft);border-color:var(--good)}
.sub{text-align:center;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}

.stroop{text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(2.6rem,14vw,3.8rem);letter-spacing:.05em;padding-block:18px;line-height:1}
.swatches{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.sw{flex:0 0 calc(33.333% - 7px);background:var(--surface);border-radius:16px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 3px 0 var(--line)}
.swatches.n4 .sw{flex-basis:calc(50% - 5px)}
.sw i{width:42px;height:42px;border-radius:50%}
.sw span{font-weight:800;font-size:1rem}

.hintchip{align-self:center;background:var(--p);color:var(--c);font-weight:800;padding:6px 14px;border-radius:99px;font-size:.95rem}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:8px}
.ltile{width:clamp(46px,14vw,58px);height:clamp(50px,15vw,62px);border-radius:12px;background:var(--surface);border-bottom:4px solid var(--c);font-family:var(--display);font-weight:600;font-size:clamp(1.4rem,7vw,1.9rem);color:var(--ink)}
.ltile.used{visibility:hidden}
.links{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.links button{padding:10px 16px;border-radius:99px;background:var(--surface);font-weight:800;color:var(--muted);font-size:.95rem}
.msg{text-align:center;font-weight:800;color:var(--sun-deep);min-height:1.45em}

.fgrid{display:grid;gap:6px}
.fcell{aspect-ratio:1/1;border-radius:12px;background:var(--surface);display:grid;place-items:center;box-shadow:0 2px 0 var(--line);max-width:100%;line-height:1}
.fcell.ok{background:var(--good-soft)!important;box-shadow:0 0 0 3px var(--good)!important;color:inherit!important}
.fcell.no{background:var(--bad-soft)!important;box-shadow:0 0 0 3px var(--bad)!important;color:inherit!important}

.float{position:absolute;left:50%;top:110px;transform:translateX(-50%);font-family:var(--display);font-weight:700;font-size:1.7rem;color:var(--good);pointer-events:none;animation:floatUp 1s ease forwards;white-space:nowrap;text-shadow:0 2px 0 var(--surface)}
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);background:var(--ink);color:var(--on-ink);padding:14px 22px;border-radius:18px;font-family:var(--display);font-weight:600;font-size:1.3rem;text-align:center;z-index:30;pointer-events:none;animation:toast 1.4s ease forwards;box-shadow:0 10px 30px rgba(21,34,56,.3);max-width:calc(100% - 40px)}
.toast small{display:block;font-family:var(--body);font-size:.85rem;color:var(--sun)}

/* Ergebnis */
.result{display:flex;flex-direction:column;gap:14px;text-align:center;padding-top:20px}
.bigstars{font-size:clamp(3.6rem,18vw,4.6rem);line-height:1;display:flex;justify-content:center;gap:6px}
.bigstars span{color:#CFD9E5;display:inline-block;animation:starIn .55s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:var(--d)}
.bigstars span.on{color:var(--sun);text-shadow:0 4px 0 var(--sun-deep)}
.bigstars span:nth-child(2){transform:translateY(-12px)}
.result h1{font-size:2.1rem}
.result .line{color:var(--muted);font-weight:700}
.gain{align-self:center;background:var(--sun-soft);color:var(--ink);font-family:var(--display);font-weight:600;font-size:1.4rem;padding:8px 18px;border-radius:99px}
.unlock{background:var(--p);color:var(--c);border-radius:16px;padding:12px;font-weight:800}
.result .btns{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.textbtn{color:var(--muted);font-weight:800;padding:10px;text-decoration:underline;text-underline-offset:3px}

/* Overlay */
#overlay{position:fixed;inset:0;background:rgba(21,34,56,.55);display:grid;place-items:center;z-index:40;padding:20px max(20px,env(safe-area-inset-right,0px)) 20px max(20px,env(safe-area-inset-left,0px))}
.ov{background:var(--surface);border-radius:26px;padding:26px 22px 22px;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;animation:pop .4s ease}
.ov .kicker{font-size:.8rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sun-deep)}
.ov h2{font-size:1.7rem}
.ov p{color:var(--muted);font-weight:700}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}

<script>
(() => {
'use strict';

/* ---------- Hilfen ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dayKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => dayKey(new Date());
const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dayKey(d); };
let reduceMotion = false;
try { reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

const FLAME = '<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12.6 2.2c.4 3 2.3 4.6 3.9 6.4 1.4 1.6 2.5 3.4 2.5 5.9A7 7 0 0 1 12 21.5a7 7 0 0 1-7-7c0-2.7 1.4-4.6 2.9-6 .2 1.7.9 3 2.2 3.8-.4-3.6.8-7 2.5-10.1z"/></svg>';
const CHEST = (open) => `<svg class="chest ${open ? 'open' : ''}" viewBox="0 0 72 64" width="72" height="64" aria-hidden="true">
  ${open ? '<circle cx="36" cy="22" r="20" fill="#FFD34D" opacity=".35"/>' : ''}
  <rect x="7" y="28" width="58" height="32" rx="6" fill="#C9822B"/>
  <rect x="7" y="40" width="58" height="5" fill="#9C6420"/>
  ${open ? '<path d="M7 28 L14 6 L58 6 L65 28 Z" fill="#E6A24A"/>' : '<path d="M7 30 Q7 10 36 10 Q65 10 65 30 Z" fill="#E6A24A"/>'}
  <rect x="7" y="27" width="58" height="5" fill="#8A5517"/>

/* ---------- Speicher ---------- */
const KEY = 'denkspass-v1';
const fresh = () => ({ name: '', xp: 0, streak: 0, lastDay: null, today: { day: null, rounds: 0, chest: false }, games: {}, badges: {}, stats: { rounds: 0, correct: 0, perfect: 0, maxCombo: 0 } });
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const s = JSON.parse(raw); const f = fresh(); return Object.assign(f, s, { stats: Object.assign(f.stats, s.stats || {}), today: Object.assign(f.today, s.today || {}) }); }
  } catch (e) {}
  return fresh();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
let S = load();
const gs = id => (S.games[id] = S.games[id] || { unlocked: 1, stars: {}, last: 0, played: 0 });
const todayState = () => S.today.day === today() ? S.today : { day: today(), rounds: 0, chest: false };
const liveStreak = () => (S.lastDay === today() || S.lastDay === yesterday()) ? S.streak : 0;

/* ---------- Level ---------- */
const TITLES = ['Neugierige Nase', 'Wacher Kopf', 'Kluger Fuchs', 'Rätselfreundin', 'Denk-Akrobatin', 'Gedächtnis-Ass', 'Knobel-Meisterin', 'Grips-Legende', 'Superhirn'];
function levelInfo(xp) { let L = 1, base = 0, need = 150; while (xp >= base + need) { base += need; L++; need = 150 + 75 * (L - 1); } return { L, into: xp - base, need }; }
const titleFor = L => TITLES[Math.min(L - 1, TITLES.length - 1)];

/* ---------- Abzeichen ---------- */
const BADGES = [
  { id: 'erste', sym: '1', name: 'Erste Runde', desc: 'Du hast deine erste Runde gespielt.', test: () => S.stats.rounds >= 1 },
  { id: 'drei', sym: '★', name: 'Drei Sterne', desc: 'Eine Runde mit allen 3 Sternen geschafft.', test: () => S.stats.perfect >= 1 },
  { id: 'tagesziel', sym: '✓', name: 'Tagesziel', desc: 'An einem Tag 3 Runden gespielt.', test: () => S.today.chest },
  { id: 'alle', sym: '6', name: 'Entdeckerin', desc: 'Jedes der 6 Spiele einmal ausprobiert.', test: () => GAMES.every(x => (S.games[x.id] || {}).played > 0) },
  { id: 'serie', sym: '10', name: 'Lauffeuer', desc: '10 richtige Antworten am Stück.', test: () => S.stats.maxCombo >= 10 },
  { id: 'tage3', sym: '3T', name: 'Dranbleiben', desc: '3 Tage hintereinander gespielt.', test: () => S.streak >= 3 },
  { id: 'stufe5', sym: 'S5', name: 'Halbzeit', desc: 'In einem Spiel Stufe 5 freigeschaltet.', test: () => GAMES.some(x => (S.games[x.id] || {}).unlocked >= 5) },
  { id: 'perfekt5', sym: '5★', name: 'Sternenregen', desc: '5 Runden mit 3 Sternen gespielt.', test: () => S.stats.perfect >= 5 },
  { id: 'tage7', sym: '7T', name: 'Ganze Woche', desc: '7 Tage hintereinander gespielt.', test: () => S.streak >= 7 },
  { id: 'hundert', sym: '100', name: 'Hundert', desc: 'Insgesamt 100 richtige Antworten.', test: () => S.stats.correct >= 100 },
  { id: 'level5', sym: 'L5', name: 'Aufsteigerin', desc: 'Level 5 erreicht.', test: () => levelInfo(S.xp).L >= 5 },
  { id: 'gipfel', sym: 'S10', name: 'Gipfel', desc: 'In einem Spiel Stufe 10 freigeschaltet.', test: () => GAMES.some(x => (S.games[x.id] || {}).unlocked >= 10) },
];
function checkBadges() { const got = []; for (const b of BADGES) if (!S.badges[b.id] && b.test()) { S.badges[b.id] = today(); got.push(b); } return got; }

/* ---------- Inhalte ---------- */
const MIXED = ['🍎', '🐶', '🌻', '🚗', '⚽', '🎈', '🐟', '🍰', '🏠', '🌙', '🎁', '🦋'];
const FRUITS = ['🍎', '🍏', '🍐', '🍊', '🍋', '🍑', '🍒', '🍓', '🍇', '🍉', '🍌', '🥝'];
const ANIMALS = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮'];
const COLORS = [
  { id: 'rot', n: 'ROT', l: 'Rot', c: '#D9343B' }, { id: 'blau', n: 'BLAU', l: 'Blau', c: '#2563EB' },
  { id: 'gruen', n: 'GRÜN', l: 'Grün', c: '#15935A' }, { id: 'gelb', n: 'GELB', l: 'Gelb', c: '#E0A100' },
  { id: 'lila', n: 'LILA', l: 'Lila', c: '#8B45E0' },
];
const WORDS = {
  4: [['HAUS', 'Wohnen'], ['BAUM', 'Natur'], ['HUND', 'Tier'], ['BROT', 'Essen'], ['MOND', 'Himmel'], ['ROSE', 'Blume'], ['BALL', 'Spiel'], ['TOPF', 'Küche'], ['SOFA', 'Wohnzimmer'], ['NASE', 'Gesicht'], ['BUCH', 'Lesen'], ['ENTE', 'Tier'], ['SAFT', 'Getränk'], ['HAND', 'Körper']],
  5: [['APFEL', 'Obst'], ['KATZE', 'Tier'], ['BLUME', 'Garten'], ['STUHL', 'Möbel'], ['SONNE', 'Himmel'], ['LAMPE', 'Licht'], ['KERZE', 'Licht'], ['GABEL', 'Besteck'], ['TISCH', 'Möbel'], ['PFERD', 'Tier'], ['WOLKE', 'Himmel'], ['BRIEF', 'Post'], ['BIRNE', 'Obst']],
  6: [['GARTEN', 'Draußen'], ['ZUCKER', 'Backen'], ['KUCHEN', 'Kaffeetisch'], ['TELLER', 'Küche'], ['KOFFER', 'Reise'], ['SCHULE', 'Lernen'], ['KIRCHE', 'Gebäude'], ['BUTTER', 'Frühstück'], ['TOMATE', 'Gemüse'], ['SOMMER', 'Jahreszeit'], ['WINTER', 'Jahreszeit'], ['KISSEN', 'Schlafen'], ['BANANE', 'Obst']],
  7: [['FENSTER', 'Haus'], ['SPIEGEL', 'Badezimmer'], ['FAHRRAD', 'Fahrzeug'], ['ZEITUNG', 'Lesen'], ['SCHRANK', 'Möbel'], ['TEPPICH', 'Boden'], ['GITARRE', 'Instrument'], ['ELEFANT', 'Tier'], ['PINGUIN', 'Tier'], ['KONZERT', 'Ausflug'], ['STRASSE', 'Draußen']],
  8: [['ERDBEERE', 'Obst'], ['FRÜHLING', 'Jahreszeit'], ['KALENDER', 'Zeit'], ['HANDTUCH', 'Badezimmer'], ['SCHÜSSEL', 'Küche'], ['FLUGZEUG', 'Reise'], ['KAROTTEN', 'Gemüse'], ['HAUSTIER', 'Zuhause']],
  10: [['KARTOFFEL', 'Gemüse'], ['SCHOKOLADE', 'Süßes'], ['GEBURTSTAG', 'Feier'], ['REGENBOGEN', 'Himmel'], ['SONNENBLUME', 'Garten'], ['KÜHLSCHRANK', 'Küche'], ['BRIEFMARKE', 'Post'], ['WEIHNACHTEN', 'Fest'], ['ZAHNBÜRSTE', 'Badezimmer'], ['SPAZIERGANG', 'Draußen']],
};
const ODD = {
  easy: [['🍎', '🍌'], ['🐶', '🐱'], ['⭐', '🌙'], ['🚗', '🚲'], ['🌻', '🌵'], ['🎈', '🎁']],
  mid: [['🍎', '🍅'], ['🐻', '🐨'], ['🌸', '🌺'], ['🍊', '🍑'], ['🐢', '🐊'], ['⚽', '🏀']],
  hard: [['😀', '😃'], ['🕐', '🕑'], ['🙂', '😊'], ['😐', '😑'], ['🌕', '🌖'], ['💙', '💜']],

/* ---------- Kleine Bausteine für Spiele ---------- */
function runBar(el, ms) { el.style.transition = 'none'; el.style.width = '100%'; void el.offsetWidth; el.style.transition = `width ${ms}ms linear`; el.style.width = '0%'; }
function freezeBar(el) { const w = getComputedStyle(el).width; el.style.transition = 'none'; el.style.width = w; }

function mathTask(s) {
  let a, b, c;
  const add = (x, y) => ({ q: `${x} + ${y}`, a: x + y });
  const sub = (x, y) => ({ q: `${x} − ${y}`, a: x - y });
  const coin = () => Math.random() < .5;
  switch (s) {
    case 1: return add(ri(1, 5), ri(1, 5));
    case 2: a = ri(2, 12); return add(a, ri(2, 20 - a));
    case 3: if (coin()) { a = ri(2, 12); return add(a, ri(2, 20 - a)); } a = ri(6, 20); return sub(a, ri(1, a - 1));
    case 4: if (coin()) { a = ri(10, 35); return add(a, ri(5, 50 - a)); } a = ri(15, 50); return sub(a, ri(3, a - 5));
    case 5: a = ri(2, 5); b = ri(2, 10); return { q: `${a} × ${b}`, a: a * b };
    case 6: if (coin()) { a = ri(20, 70); return add(a, ri(10, 100 - a)); } a = ri(30, 100); return sub(a, ri(10, a - 10));
    case 7: a = ri(3, 10); b = ri(3, 10); return { q: `${a} × ${b}`, a: a * b };
    case 8: b = ri(2, 9); c = ri(2, 10); return { q: `${b * c} ÷ ${b}`, a: c };
    case 9: a = ri(10, 40); b = ri(5, 30); c = ri(3, a + b - 2); return { q: `${a} + ${b} − ${c}`, a: a + b - c };
    default: {
      const k = ri(0, 2);
      if (k === 0) { a = ri(3, 9); b = ri(3, 9); c = ri(2, 20); return { q: `${a} × ${b} + ${c}`, a: a * b + c }; }
      if (k === 1) { b = ri(3, 9); c = ri(3, 12); a = ri(5, 30); return { q: `${b * c} ÷ ${b} + ${a}`, a: c + a }; }
      a = ri(50, 150); b = ri(20, 90); return coin() ? add(a, b) : sub(a + b, ri(15, a));
    }
  }
}
function distractors(ans) {
  const set = new Set([ans]);
  for (const c of shuffle([ans + 1, ans - 1, ans + 2, ans - 2, ans + 10, ans - 10, ans + 3])) { if (set.size >= 4) break; if (c >= 0) set.add(c); }
  let k = 4; while (set.size < 4) set.add(ans + k++);
  set.delete(ans); return [...set];
}

/* ---------- Spiele ---------- */
const GAMES = [
  {
    id: 'rechnen', name: 'Kopfrechnen', trains: 'Konzentration und Zahlen',

        if (i >= total) return ctx.finish();

          <div class="bonus"><i></i></div><p class="bonus-l">Blitzbonus</p>
          <div class="choices">${opts.map(o => `<button class="choice" data-v="${o}">${o}</button>`).join('')}</div>`;
        const bar = $('.bonus i', ctx.stage); runBar(bar, tl);
        const t0 = performance.now(); let done = false;
        $$('.choice', ctx.stage).forEach(b => b.onclick = () => {
          if (done) return; done = true; freezeBar(bar);
          $('.q', ctx.stage).textContent = t.a;
          const ok = +b.dataset.v === t.a;
          if (ok) { b.classList.add('ok'); ctx.good(performance.now() - t0 < tl ? 5 : 0); }
          else { b.classList.add('no'); $(`[data-v="${t.a}"]`, ctx.stage).classList.add('ok'); ctx.bad(); }
          i++; ctx.progress(i, total); ctx.later(next, ok ? 750 : 1500);

  {

    art: '<span class="art-cards"><i></i><i class="up">♥</i></span>',
    start(ctx) {
      const s = ctx.stufe, pairs = [3, 4, 6, 6, 8, 8, 10, 10, 12, 12][s - 1];
      const set = s >= 6 ? pick([FRUITS, ANIMALS]) : MIXED;
      const syms = shuffle(set.slice()).slice(0, pairs), deck = shuffle([...syms, ...syms]);
      const cols = deck.length <= 6 ? 3 : 4, peek = [3000, 2500, 2200, 1800, 1400, 0, 0, 0, 0, 0][s - 1];
      ctx.stage.innerHTML = `<p class="ask" id="pask">${peek ? 'Schau genau hin …' : 'Finde alle Paare'}</p>
        <div class="cards c${cols} ${deck.length > 16 ? 'sq' : ''}">${deck.map((e, k) => `<button class="cardx" data-k="${k}" aria-label="Karte ${k + 1}"><span class="in"><span class="bk"></span><span class="fc">${e}</span></span></button>`).join('')}</div>

      if (peek) { cards.forEach(c => c.classList.add('up')); ctx.later(() => { cards.forEach(c => c.classList.remove('up')); $('#pask').textContent = 'Finde alle Paare'; lock = false; }, peek); }

        c.classList.add('up'); open.push(c);
        if (open.length < 2) return;
        lock = true; const [a, b] = open;
        if (deck[a.dataset.k] === deck[b.dataset.k]) {
          ctx.later(() => {
            a.classList.add('done'); b.classList.add('done'); found++; open = []; lock = false;
            ctx.good(); ctx.progress(found, pairs); $('#pstat').textContent = `${found} von ${pairs} Paaren`;
            if (found === pairs) {
              const free = Math.round(pairs * 1.2);
              ctx.summary = `Alle ${pairs} Paare gefunden, ${misses} ${misses === 1 ? 'Fehlversuch' : 'Fehlversuche'}`;
              ctx.later(() => ctx.finish(1 - Math.max(0, misses - free) / (pairs * 2.5)), 700);
            }
          }, 380);
        } else {
          misses++; ctx.miss();
          ctx.later(() => { a.classList.remove('up'); b.classList.remove('up'); open = []; lock = false; }, 950);

  {

      const s = ctx.stufe, key = [4, 4, 5, 5, 6, 6, 7, 7, 8, 10][s - 1], total = 5;
      const list = shuffle(WORDS[key].slice()).slice(0, total); let i = 0;
      const next = () => {
        if (i >= total) return ctx.finish();
        const [word, hint] = list[i], L = [...word];
        let order = shuffle(L.map((_, k) => k)); let tries = 0;
        while (order.map(k => L[k]).join('') === word && tries++ < 20) order = shuffle(order);
        let picked = [], attempt = 0, done = false;
        const showHint = s <= 6;
        ctx.stage.innerHTML = `<p class="ask">Welches Wort ist das?</p>
          ${showHint ? `<span class="hintchip">Tipp: ${hint}</span>` : ''}
          <div class="slots" id="ws">${L.map((_, k) => `<button class="slot" data-s="${k}" aria-label="Feld ${k + 1}"></button>`).join('')}</div>
          <p class="msg" id="wmsg"></p>
          <div class="tiles">${order.map(k => `<button class="ltile" data-t="${k}">${L[k]}</button>`).join('')}</div>
          <div class="links">${showHint ? '' : '<button id="whint">Tipp zeigen</button>'}<button id="wskip">Auflösen</button></div>`;
        const slots = $$('.slot', ctx.stage), tiles = $$('.ltile', ctx.stage);
        const draw = () => {
          slots.forEach((el, k) => { el.textContent = picked[k] != null ? L[picked[k]] : ''; el.classList.toggle('f', picked[k] != null); });
          tiles.forEach(t => t.classList.toggle('used', picked.includes(+t.dataset.t)));
        };
        const reveal = () => { slots.forEach((el, k) => { el.textContent = L[k]; }); $('#ws').classList.add('good'); };
        const check = () => {
          const guess = picked.map(k => L[k]).join('');
          if (guess === word) { done = true; $('#ws').classList.add('good'); $('#wmsg').textContent = pick(['Prima!', 'Genau!', 'Richtig!', 'Super!']); ctx.good(attempt === 0 ? 5 : 0); i++; ctx.progress(i, total); ctx.later(next, 1100); }
          else if (attempt === 0) {
            attempt = 1; done = true; const ws = $('#ws'); ws.classList.add('badx'); $('#wmsg').textContent = 'Fast! Noch ein Versuch.';
            ctx.later(() => { ws.classList.remove('badx'); picked = []; draw(); done = false; }, 900);
          } else { done = true; ctx.bad(); reveal(); $('#wmsg').textContent = 'So heißt das Wort.'; i++; ctx.progress(i, total); ctx.later(next, 2000); }
        };
        tiles.forEach(t => t.onclick = () => { if (done) return; const k = +t.dataset.t; if (picked.includes(k)) return; picked.push(k); draw(); if (picked.length === L.length) check(); });
        slots.forEach(el => el.onclick = () => { if (done) return; const k = +el.dataset.s; if (picked[k] == null) return; picked.splice(k, 1); draw(); });
        const h = $('#whint'); if (h) h.onclick = () => { h.outerHTML = `<span class="hintchip">Tipp: ${hint}</span>`; };
        $('#wskip').onclick = () => { if (done) return; done = true; ctx.bad(); reveal(); $('#wmsg').textContent = 'So heißt das Wort.'; i++; ctx.progress(i, total); ctx.later(next, 2000); };
      };
      next();
    }
  },
  {
    id: 'finde', name: 'Finde den Unterschied', trains: 'Wahrnehmung und Tempo',
    how: 'Alle Bilder sehen gleich aus, bis auf eins. Finde das eine andere Bild so schnell du kannst.',
    art: '<span class="art-dots"><i></i><i></i><i></i><i></i><i></i><i class="odd"></i><i></i><i></i><i></i></span>',
    start(ctx) {
      const s = ctx.stufe, n = [3, 3, 4, 4, 5, 5, 5, 6, 6, 6][s - 1], lvl = s <= 3 ? 'easy' : s <= 6 ? 'mid' : 'hard';
      const total = 8, fast = s <= 4 ? 4000 : 3000; let i = 0;
      const next = () => {
        if (i >= total) return ctx.finish();
        let [a, b] = pick(ODD[lvl]); if (Math.random() < .5) [a, b] = [b, a];
        const target = ri(0, n * n - 1), fs = `calc(min(100vw, 540px) / ${n} * .5)`;
        ctx.stage.innerHTML = `<p class="ask">Welches Bild ist anders?</p>
          <div class="fgrid" style="grid-template-columns:repeat(${n},1fr)">${Array.from({ length: n * n }, (_, k) => `<button class="fcell" data-c="${k}" style="font-size:${fs}">${k === target ? b : a}</button>`).join('')}</div>`;
        const t0 = performance.now(); let done = false;
        $$('.fcell', ctx.stage).forEach(c => c.onclick = () => {
          if (done) return; done = true;
          const ok = +c.dataset.c === target;
          if (ok) { c.classList.add('ok'); ctx.good(performance.now() - t0 < fast ? 5 : 0); }
          else { c.classList.add('no'); $(`[data-c="${target}"]`, ctx.stage).classList.add('ok'); ctx.bad(); }
          i++; ctx.progress(i, total); ctx.later(next, ok ? 650 : 1500);
        });
      };
      next();
    }
  },
];
const G = Object.fromEntries(GAMES.map(x => [x.id, x]));
const gameVars = id => `--c:var(--c-${id});--p:var(--p-${id})`;

/* ---------- Bildschirme ---------- */
const screen = $('#screen');
let view = { name: 'home' }, run = null, ui = { editName: false, confirmReset: false };
function show(html) { screen.innerHTML = html; window.scrollTo(0, 0); }

function greeting() { const h = new Date().getHours(); return h < 11 ? 'Guten Morgen' : h < 18 ? 'Schönen Tag' : 'Guten Abend'; }
function suggest(excludeId) { return GAMES.filter(x => x.id !== excludeId).sort((a, b) => gs(a.id).last - gs(b.id).last)[0]; }
const starSum = id => Object.values(gs(id).stars).reduce((a, b) => a + b, 0);

function renderHome() {
  view = { name: 'home' }; stopRun();
  const lv = levelInfo(S.xp), t = todayState(), st = liveStreak(), sg = suggest();
  const goalDone = t.rounds >= 3;
  const earned = BADGES.filter(b => S.badges[b.id]).length;
  show(`
    <section class="hello">
      <div><p class="eyebrow">${greeting()}</p><h1>${S.name ? 'Hallo, ' + esc(S.name) + '!' : 'Hallo!'}</h1></div>
      <div class="streak ${S.lastDay === today() ? 'on' : ''}" aria-label="${st} Tage in Folge gespielt">${FLAME}<b>${st}</b><span>${st === 1 ? 'Tag' : 'Tage'}</span></div>
    </section>
    ${(!S.name || ui.editName) ? `<form class="card namecard" id="nameform"><label for="nameInput">Wie soll ich dich nennen?</label><div class="namerow"><input id="nameInput" maxlength="20" autocomplete="off" placeholder="Dein Vorname" value="${esc(S.name)}"><button type="submit">Speichern</button></div></form>` : ''}
    <section class="card level">
      <div class="lv-badge" aria-label="Level ${lv.L}">${lv.L}</div>
      <div class="lv-info">
        <div class="lv-title">${titleFor(lv.L)}<small>Level ${lv.L}</small></div>
        <div class="xpbar"><i style="width:${Math.round(lv.into / lv.need * 100)}%"></i></div>
        <div class="lv-sub">Noch ${lv.need - lv.into} Punkte bis Level ${lv.L + 1}</div>
      </div>
    </section>
    <section class="daily">
      <div class="daily-top">
        <div class="daily-txt">
          <h2>${goalDone ? 'Tagesziel geschafft!' : 'Tagesziel'}</h2>
          <p>${goalDone ? 'Die Truhe ist offen. Morgen wartet eine neue.' : 'Spiele heute 3 Runden und öffne die Schatztruhe.'}</p>
          <div class="dots">${[0, 1, 2].map(k => `<i class="${k < t.rounds ? 'on' : ''}">${k < t.rounds ? '✓' : ''}</i>`).join('')}</div>
        </div>
        ${CHEST(goalDone)}
      </div>
      <button class="cta" data-act="daily">${goalDone ? 'Noch eine Runde' : 'Los geht’s'}<small>${sg.name}, Stufe ${gs(sg.id).unlocked}</small></button>
    </section>
    <h2 class="sec">Spiele</h2>
    <section class="grid">${GAMES.map(x => `
      <button class="tile" data-game="${x.id}" style="${gameVars(x.id)}">
        <div class="art">${x.art}</div>
        <div class="t-name">${x.name}</div>
        <div class="t-meta"><span>Stufe ${gs(x.id).unlocked}</span><span>★ ${starSum(x.id)}/30</span></div>
      </button>`).join('')}
    </section>
    <h2 class="sec">Abzeichen <small>${earned} von ${BADGES.length}</small></h2>
    <section class="badges">${BADGES.map(b => `<button class="badge ${S.badges[b.id] ? 'got' : ''}" data-badge="${b.id}"><span class="medal">${b.sym}</span><span>${b.name}</span></button>`).join('')}</section>
    ${ui.confirmReset
      ? `<section class="card confirm"><p><b>Wirklich alles löschen?</b><br>Punkte, Sterne, Stufen und Abzeichen gehen verloren.</p><div class="row"><button class="btn-plain" data-act="reset-no">Abbrechen</button><button class="btn-danger" data-act="reset-yes">Ja, löschen</button></div></section>`
      : `<footer class="foot">${S.name ? '<button data-act="rename">Name ändern</button>' : ''}<button data-act="reset">Fortschritt löschen</button></footer>`}
  `);
  const f = $('#nameform');
  if (f) f.onsubmit = e => { e.preventDefault(); S.name = $('#nameInput').value.trim().slice(0, 20); ui.editName = false; save(); renderHome(); };
}

function renderGame(id) {
  view = { name: 'game', id }; stopRun();
  const x = G[id], st = gs(id);
  show(`
    <button class="back" data-act="home">‹ Übersicht</button>
    <section class="g-head" style="${gameVars(id)}">
      <div class="art">${x.art}</div>
      <h1>${x.name}</h1>
      <p>${x.how}</p>
      <span class="chip">Trainiert: ${x.trains}</span>
    </section>
    <h2 class="sec">Stufe wählen <small>★ ${starSum(id)} von 30</small></h2>
    <div class="stages" style="${gameVars(id)}">${Array.from({ length: 10 }, (_, k) => {
      const n = k + 1, lock = n > st.unlocked, stars = st.stars[n] || 0;
      return `<button class="stage-btn ${lock ? 'lock' : ''} ${n === st.unlocked ? 'cur' : ''}" ${lock ? 'disabled aria-label="Stufe ' + n + ' noch gesperrt"' : 'data-stufe="' + n + '" aria-label="Stufe ' + n + ', ' + stars + ' Sterne"'}>
        <b>${lock ? '🔒' : n}</b><span class="st">${lock ? '' : [1, 2, 3].map(j => j <= stars ? '<i>★</i>' : '★').join('')}</span></button>`;
    }).join('')}</div>
    <button class="cta" data-stufe="${st.unlocked}">Stufe ${st.unlocked} spielen</button>
    <p class="hint">Mit mindestens 1 Stern schaltest du die nächste Stufe frei. Schaffst du überall 3 Sterne?</p>
  `);
}

function stopRun() { if (run) { run.alive = false; run.timers.forEach(clearTimeout); run = null; } }

function startRound(id, stufe) {
  stopRun();
  view = { name: 'play', id, stufe };
  const x = G[id];
  const R = run = { id, stufe, correct: 0, wrong: 0, misses: 0, combo: 0, maxCombo: 0, xp: 0, alive: true, timers: [] };
  show(`<div class="play" style="${gameVars(id)}">
      <div class="play-top">
        <button class="x" data-act="quit" aria-label="Runde beenden">✕</button>
        <div class="play-title"><b>${x.name}</b><span>Stufe ${stufe}</span></div>
        <div class="combo" id="combo" hidden></div>
      </div>
      <div class="prog"><i id="prog"></i></div>
      <div class="stage" id="stage"></div>
    </div>`);
  const playEl = $('.play'), comboEl = $('#combo');
  const drawCombo = () => {
    if (R.combo >= 3) { comboEl.hidden = false; comboEl.innerHTML = `${FLAME}${R.combo} · ×${R.combo >= 6 ? 3 : 2}`; comboEl.style.animation = 'none'; void comboEl.offsetWidth; comboEl.style.animation = ''; }
    else comboEl.hidden = true;
  };
  const floatTxt = (txt) => { if (!R.alive) return; const f = document.createElement('div'); f.className = 'float'; f.textContent = txt; playEl.appendChild(f); setTimeout(() => f.remove(), 1100); };
  const ctx = {
    stage: $('#stage'), stufe, summary: null,
    later(fn, ms) { R.timers.push(setTimeout(() => { if (R.alive && run === R) fn(); }, ms)); },
    progress(d, t) { const p = $('#prog'); if (p) p.style.width = Math.round(d / t * 100) + '%'; },
    good(bonus = 0) {
      R.correct++; R.combo++; R.maxCombo = Math.max(R.maxCombo, R.combo);
      const mult = R.combo >= 6 ? 3 : R.combo >= 3 ? 2 : 1, pts = 10 * mult + bonus; R.xp += pts;
      floatTxt('+' + pts);
      drawCombo();
      if (R.combo === 3) toast('Serie!', 'Ab jetzt doppelte Punkte');
      else if (R.combo === 6) toast('Super-Serie!', 'Dreifache Punkte');
      else if (R.combo === 10) toast('Unglaublich!', '10 richtig am Stück');
    },
    bad() { R.wrong++; R.combo = 0; drawCombo(); },
    miss() { R.misses++; R.combo = 0; drawCombo(); },
    finish(ratio) {
      if (!R.alive) return;
      R.alive = false; R.timers.forEach(clearTimeout);
      const r = ratio != null ? ratio : R.correct / Math.max(1, R.correct + R.wrong);
      endRound(R, clamp(r, 0, 1), ctx.summary);
    },
  };
  x.start(ctx);
}

function toast(big, small) {
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `${big}<small>${small}</small>`;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1500);
}

const HEAD = {
  0: ['Fast! Gleich nochmal?', 'Knapp daneben, du schaffst das!', 'Übung macht die Meisterin!'],
  1: ['Geschafft!', 'Gut gemacht!', 'Stufe bestanden!'],
  2: ['Richtig gut!', 'Klasse!', 'Stark gespielt!'],
  3: ['Perfekt!', 'Fantastisch!', 'Einfach spitze!'],
};

function endRound(R, ratio, summary) {
  run = null;
  const stars = ratio >= .95 ? 3 : ratio >= .75 ? 2 : ratio >= .5 ? 1 : 0;
  const st = gs(R.id), prev = st.stars[R.stufe] || 0;
  st.stars[R.stufe] = Math.max(prev, stars);
  let unlocked = false;
  if (stars >= 1 && R.stufe === st.unlocked && st.unlocked < 10) { st.unlocked++; unlocked = true; }
  st.last = Date.now(); st.played = (st.played || 0) + 1;
  const bonus = stars * 15 + (stars === 3 ? 15 : 0), gained = R.xp + bonus;
  const before = levelInfo(S.xp).L;
  S.xp += gained;
  const d = today();
  if (S.today.day !== d) S.today = { day: d, rounds: 0, chest: false };
  S.today.rounds++;
  if (S.lastDay !== d) { S.streak = S.lastDay === yesterday() ? S.streak + 1 : 1; S.lastDay = d; }
  let chest = false;
  if (S.today.rounds >= 3 && !S.today.chest) { S.today.chest = true; S.xp += 50; chest = true; }
  S.stats.rounds++; S.stats.correct += R.correct; if (stars === 3) S.stats.perfect++; S.stats.maxCombo = Math.max(S.stats.maxCombo, R.maxCombo);
  const after = levelInfo(S.xp).L;
  const newBadges = checkBadges();
  save();

  const x = G[R.id], canNext = R.stufe < st.unlocked && R.stufe < 10, t = todayState();
  const line = summary || `${R.correct} von ${R.correct + R.wrong} richtig`;
  view = { name: 'result', id: R.id, stufe: R.stufe };
  show(`<section class="result" style="${gameVars(R.id)}">
      <div class="bigstars" aria-label="${stars} von 3 Sternen">${[1, 2, 3].map(k => `<span class="${k <= stars ? 'on' : ''}" style="--d:${200 + k * 260}ms">★</span>`).join('')}</div>
      <h1>${pick(HEAD[stars])}</h1>
      <p class="line">${x.name}, Stufe ${R.stufe} · ${line}${R.maxCombo >= 3 ? ` · längste Serie ${R.maxCombo}` : ''}</p>
      <div class="gain">+${gained} Punkte</div>
      ${unlocked ? `<div class="unlock">Stufe ${R.stufe + 1} ist jetzt freigeschaltet!</div>` : ''}
      ${stars === 0 ? '<p class="line">Für einen Stern brauchst du mindestens die Hälfte richtig.</p>' : ''}
      <div class="btns">
        ${canNext ? `<button class="cta" data-act="go" data-id="${R.id}" data-n="${R.stufe + 1}">Weiter zu Stufe ${R.stufe + 1}</button>` : ''}
        <button class="cta ${canNext ? 'alt' : ''}" data-act="go" data-id="${R.id}" data-n="${R.stufe}">${stars === 3 ? 'Nochmal spielen' : 'Nochmal versuchen'}</button>
        ${t.rounds < 3 ? `<button class="cta alt" data-act="daily-next">Anderes Spiel (Tagesziel ${t.rounds}/3)</button>` : ''}
        <button class="textbtn" data-act="home">Zur Übersicht</button>
      </div>
    </section>`);
  if (stars >= 2) setTimeout(() => confetti(stars === 3 ? 160 : 70), 700);

  const queue = [];
  if (chest) queue.push({ html: `${CHEST(true)}<p class="kicker">Tagesziel</p><h2>Schatztruhe geöffnet!</h2><p>Du hast heute 3 Runden gespielt. Dafür gibt es 50 Bonuspunkte.</p>`, party: true });
  if (after > before) queue.push({ html: `<div class="lv-badge big">${after}</div><p class="kicker">Aufgestiegen</p><h2>Level ${after}!</h2><p>Dein neuer Titel: <b>${titleFor(after)}</b></p>`, party: true });
  for (const b of newBadges) queue.push({ html: `<div class="badge got"><span class="medal big">${b.sym}</span></div><p class="kicker">Neues Abzeichen</p><h2>${b.name}</h2><p>${b.desc}</p>`, party: true });
  if (queue.length) setTimeout(() => runQueue(queue), 1500);
}

function overlay(html, party) {
  return new Promise(res => {
    const o = $('#overlay');
    o.innerHTML = `<div class="ov" role="dialog" aria-modal="true">${html}<button class="cta" id="ovok">Weiter</button></div>`;
    o.hidden = false; if (party) confetti(120);
    const ok = $('#ovok'); ok.focus({ preventScroll: true });
    ok.onclick = () => { o.hidden = true; o.innerHTML = ''; res(); };
  });
}
async function runQueue(q) { for (const it of q) await overlay(it.html, it.party); }

/* ---------- Konfetti ---------- */
let confettiRaf = 0;
function confetti(count = 120) {
  if (reduceMotion) return;
  const cv = $('#confetti'), cx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
  const cols = ['#FFB800', '#2F6FEB', '#D9601F', '#7447DB', '#C93479', '#12865F', '#08809F'];
  const ps = Array.from({ length: count }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 16 * dpr, vy: (-Math.random() * 14 - 6) * dpr, r: (4 + Math.random() * 5) * dpr, c: pick(cols), a: Math.random() * 6, va: (Math.random() - .5) * .4 }));
  cancelAnimationFrame(confettiRaf); const t0 = performance.now();
  const tick = t => {
    cx.clearRect(0, 0, W, H);
    for (const p of ps) { p.vy += .45 * dpr; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); cx.restore(); }
    if (t - t0 < 2600) confettiRaf = requestAnimationFrame(tick); else cx.clearRect(0, 0, W, H);
  };
  confettiRaf = requestAnimationFrame(tick);
}

/* ---------- Klicks ---------- */
screen.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-game],[data-stufe],[data-badge]');
  if (!el || !screen.contains(el)) return;
  if (el.dataset.game) return renderGame(el.dataset.game);
  if (el.dataset.stufe) return startRound(view.id, +el.dataset.stufe);
  if (el.dataset.badge) {
    const b = BADGES.find(x => x.id === el.dataset.badge), got = S.badges[b.id];
    return overlay(`<div class="badge ${got ? 'got' : ''}"><span class="medal big">${b.sym}</span></div><p class="kicker">${got ? 'Verdient' : 'Noch offen'}</p><h2>${b.name}</h2><p>${b.desc}</p>`, false);
  }
  switch (el.dataset.act) {
    case 'home': return renderHome();
    case 'daily': { const sg = suggest(); return startRound(sg.id, gs(sg.id).unlocked); }
    case 'daily-next': { const sg = suggest(view.id); return startRound(sg.id, gs(sg.id).unlocked); }
    case 'quit': return renderGame(view.id);
    case 'go': return startRound(el.dataset.id, +el.dataset.n);
    case 'rename': ui.editName = true; return renderHome();
    case 'reset': ui.confirmReset = true; return renderHome();
    case 'reset-no': ui.confirmReset = false; return renderHome();
    case 'reset-yes': S = fresh(); save(); ui.confirmReset = false; return renderHome();
  }
});

renderHome();
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
